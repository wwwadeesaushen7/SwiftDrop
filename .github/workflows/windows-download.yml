name: Windows installer (version checked)
run-name: Windows installer · ${{ github.ref_name }} · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-download.yml'
      - 'lib/**'
      - 'test/**'
      - 'windows/**'
      - 'packaging/**'
      - 'tool/package-windows.ps1'
      - 'tool/publish_windows.py'
      - 'pubspec.*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and verify Windows installer
    runs-on: windows-2022
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --dart-define=SWIFTDROP_TEST=true --reporter expanded
      - run: flutter build windows --release --no-pub
      - name: Check executable version and package matching installer
        id: package
        shell: pwsh
        run: ./tool/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/installer/SwiftDrop-${{ steps.package.outputs.version }}-windows-x64-setup.exe
            build/installer/BUILD-INFO.json
            build/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-${{ steps.package.outputs.version }}-Windows-portable-${{ github.sha }}
          if-no-files-found: error
          path: build/windows/x64/runner/Release/**
  publish:
    name: Publish direct Windows download
    needs: build
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/windows-installer
      - name: Verify hash and publish versioned installer or build status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SOURCE_COMMIT: ${{ github.sha }}
          WINDOWS_ARTIFACT_DIR: ${{ runner.temp }}/windows-installer
          WINDOWS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tool/publish_windows.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- downloads/windows-build.json downloads/WINDOWS.md
          if [ "$BUILD_RESULT" = success ]; then
            git add -- 'downloads/*windows-x64-setup.exe' 'downloads/*windows-x64-BUILD-INFO.json' 'downloads/*windows-x64-SHA256SUMS.txt'
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish checked Windows installer and build status [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          cat downloads/WINDOWS.md >> "$GITHUB_STEP_SUMMARY"
