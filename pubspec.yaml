name: swiftdrop
description: Private, consent-based local file sharing.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  basic_utils: ^5.8.2
  bonsoir: ^7.1.5
  crypto: ^3.0.7
  desktop_drop: 0.8.4
  file_picker: ^13.2.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  sqlite3: ^3.8.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
